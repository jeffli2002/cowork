<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Center circle -->
  <circle cx="12" cy="12" r="2.5" fill="#D97757"/>
  <!-- 8 radiating petals/rays - cardinal directions -->
  <ellipse cx="12" cy="5" rx="1.5" ry="3.5" fill="#D97757"/>
  <ellipse cx="12" cy="19" rx="1.5" ry="3.5" fill="#D97757"/>
  <ellipse cx="5" cy="12" rx="3.5" ry="1.5" fill="#D97757"/>
  <ellipse cx="19" cy="12" rx="3.5" ry="1.5" fill="#D97757"/>
  <!-- Diagonal directions -->
  <ellipse cx="7.07" cy="7.07" rx="1.5" ry="3.5" fill="#D97757" transform="rotate(-45 7.07 7.07)"/>
  <ellipse cx="16.93" cy="16.93" rx="1.5" ry="3.5" fill="#D97757" transform="rotate(-45 16.93 16.93)"/>
  <ellipse cx="16.93" cy="7.07" rx="1.5" ry="3.5" fill="#D97757" transform="rotate(45 16.93 7.07)"/>
  <ellipse cx="7.07" cy="16.93" rx="1.5" ry="3.5" fill="#D97757" transform="rotate(45 7.07 16.93)"/>
</svg>

