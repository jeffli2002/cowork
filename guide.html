<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Cowork Guide</title>
    <link rel="canonical" href="https://cowork.mobi/en/guide.html" />
    <script>
        // Language detection and redirect
        const LOCALE_KEY = "coworkLocale";
        const normalizeLocale = (value) => {
            if (!value) {
                return "en";
            }
            const lower = value.toLowerCase();
            if (lower.startsWith("zh")) {
                return "zh";
            }
            if (lower.startsWith("ja")) {
                return "ja";
            }
            if (lower.startsWith("es")) {
                return "es";
            }
            if (lower.startsWith("de")) {
                return "de";
            }
            if (lower.startsWith("fr")) {
                return "fr";
            }
            return "en";
        };

        // Get locale from localStorage or browser language
        const storedLocale = localStorage.getItem(LOCALE_KEY);
        const browserLocale = navigator.language || navigator.userLanguage;
        const detectedLocale = storedLocale || normalizeLocale(browserLocale);
        
        // Redirect to appropriate language version (without .html extension)
        const localeMap = {
            en: "/en/guide",
            zh: "/zh/guide",
            ja: "/ja/guide",
            es: "/es/guide",
            de: "/de/guide",
            fr: "/fr/guide"
        };
        
        const targetUrl = localeMap[detectedLocale] || localeMap.en;
        
        // Immediate redirect
        window.location.replace(targetUrl);
    </script>
    <meta http-equiv="refresh" content="0; url=/en/guide">
</head>
<body>
    <p>Redirecting to <a href="/en/guide.html">Claude Cowork Guide</a>...</p>
</body>
</html>
