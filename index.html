<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/en/" />
    <link rel="canonical" href="/en/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="zh" href="/zh/" />
    <link rel="alternate" hreflang="ja" href="/ja/" />
    <link rel="alternate" hreflang="es" href="/es/" />
    <link rel="alternate" hreflang="de" href="/de/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="x-default" href="/en/" />
    <script>
      // Immediate redirect - check for stored locale preference
      (function() {
        const LOCALE_KEY = "coworkLocale";
        const storedLocale = window.localStorage.getItem(LOCALE_KEY);
        
        const localeDirs = {
          en: "/en/",
          zh: "/zh/",
          ja: "/ja/",
          es: "/es/",
          de: "/de/",
          fr: "/fr/"
        };
        
        // Redirect to stored locale or default to /en/
        const target = storedLocale && localeDirs[storedLocale] 
          ? localeDirs[storedLocale] 
          : "/en/";
        
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/en/">English version</a>...</p>
  </body>
</html>
