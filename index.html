<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cowork | Choose Language</title>
    <meta
      name="description"
      content="Select your preferred language to view the Cowork homepage."
    />
    <link rel="canonical" href="/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="zh" href="/zh/" />
    <link rel="alternate" hreflang="ja" href="/ja/" />
    <link rel="alternate" hreflang="es" href="/es/" />
    <link rel="alternate" hreflang="de" href="/de/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="x-default" href="/" />
    <style>
      body {
        margin: 0;
        font-family: "Poppins", Arial, sans-serif;
        color: #141413;
        background: #faf9f5;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        text-align: center;
        padding: 24px 28px;
        border: 1px solid rgba(20, 20, 19, 0.12);
        border-radius: 16px;
        background: #fff;
        max-width: 460px;
        box-shadow: 0 24px 50px rgba(20, 20, 19, 0.08);
      }
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 16px;
      }
      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(20, 20, 19, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Choose your language</h1>
      <p>Select a locale to continue to the Cowork homepage.</p>
      <div class="links">
        <a href="en/" data-locale="en">English</a>
        <a href="zh/" data-locale="zh">简体中文</a>
        <a href="ja/" data-locale="ja">日本語</a>
        <a href="es/" data-locale="es">Español</a>
        <a href="de/" data-locale="de">Deutsch</a>
        <a href="fr/" data-locale="fr">Français</a>
      </div>
    </div>
    <script>
      const LOCALE_KEY = "coworkLocale";
      
      // Auto-redirect to /en/ if no locale is stored
      const storedLocale = window.localStorage.getItem(LOCALE_KEY);
      if (!storedLocale) {
        window.location.replace("/en/");
        return;
      }
      
      // Redirect to stored locale if available
      const localeDirs = {
        en: "/en/",
        zh: "/zh/",
        ja: "/ja/",
        es: "/es/",
        de: "/de/",
        fr: "/fr/"
      };
      
      const target = localeDirs[storedLocale] || "/en/";
      window.location.replace(target);
      
      // Handle manual language selection
      document.querySelectorAll("[data-locale]").forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const locale = link.dataset.locale || "en";
          window.localStorage.setItem(LOCALE_KEY, locale);
          window.location.href = localeDirs[locale] || "/en/";
        });
      });
    </script>
  </body>
</html>
